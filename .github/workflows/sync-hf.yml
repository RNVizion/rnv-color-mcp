name: Sync to Hugging Face Space

# Mirrors this GitHub repo to the HF Space on every push to main, so the live
# server is never stale relative to GitHub. GitHub is the source of truth; the
# Space is a mirror.
#
# Gated on tests since 2026-07-26: the sync job will not run unless the suite
# passes, so a broken commit cannot reach the live server. The tests run here as
# well as in tests.yml on purpose — tests.yml covers pull requests and provides
# the status check, this one guards the deployment. Duplicated seconds are worth
# a gate that cannot be bypassed by a workflow-ordering accident.
#
# Requires the GitHub Actions secret HF_SYNC_TOKEN: a Hugging Face WRITE token
# (the hf_... value) scoped to the RNVizion/rnv-color-mcp Space.

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # shallow is fine; nothing here pushes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # matches the Space image; see tests.yml matrix
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      # The mirror must carry the commit it SAYS it carries before that claim
      # ships to production. This is the transcription half of the brand check;
      # the currency half (has upstream moved PAST the pin) deliberately does
      # NOT run here, because upstream moving is not a defect of this
      # repository and must never block a deploy. Gate a defect, warn about a
      # queue.
      #
      # Exit 2 is what makes this safe to put on the deploy path at all: the
      # check reads the network, and an unreachable GitHub is someone else's
      # outage, not a bad mirror. Without the distinction this step would
      # block every deploy during an upstream incident, which is a queue
      # failing a defect gate -- the exact shape that teaches people to
      # disable a check.
      - name: Mirror matches its pinned commit
        run: |
          set +e
          python scripts/check_brand_currency.py --mode transcription
          code=$?
          set -e
          case $code in
            0)
              echo "mirror verified against its pinned commit"
              ;;
            2)
              echo "::warning title=Mirror not verified::Upstream was unreachable, so the mirror could not be checked against its pin. This is an outage, not a mismatch -- deploying."
              ;;
            *)
              echo "::error title=Mirror does not match its pin::engine/brand_vocab.py does not carry the commit its docstring claims. Fix the mirror or the pin before this ships."
              exit 1
              ;;
          esac

  sync-to-hub:
    needs: test               # the gate: no green suite, no deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history; a shallow clone can't push cleanly

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_SYNC_TOKEN }}
        run: |
          git push --force \
            "https://RNVizion:${HF_TOKEN}@huggingface.co/spaces/RNVizion/rnv-color-mcp" \
            main:main
