name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry when a version tag is pushed.
#
# To cut a release:
#   1. In a pull request, set "version" in server.json to the new version, and merge it.
#   2. Tag that merge commit vX.Y.Z and push the tag.
#   3. This workflow checks that the tag and server.json agree, that the tagged commit is
#      on main, and then publishes. If either check fails it stops before publishing, so
#      the version is not used up: fix it, move the tag, and push the tag again.
#
# It never pushes to this repository. Until 2026-10-02 it stamped the tag's version into
# server.json and pushed that back to main. main now takes only pull requests (a ruleset),
# so that push would have been refused after the publish had already succeeded. The
# version is now set where every other change is made, in a pull request, and
# scripts/check_release_version.py refuses a tag that says something else.
#
# Auth: GitHub OIDC for the registry (no secret needed; the io.github.RNVizion/*
# namespace is owned by this repo's owner).
#
# A manual run (workflow_dispatch) publishes only when it is started from a version tag;
# started from a branch, the first check refuses it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read only: this workflow never commits or pushes
      id-token: write       # needed for OIDC authentication to the registry
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so the tagged commit can be checked against main

      - name: The tag and server.json agree
        run: python3 scripts/check_release_version.py "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"

      - name: The tagged commit is on main
        run: |
          git fetch --quiet origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"; then
            echo "The tagged commit $GITHUB_SHA is on main (main is at $main_sha)."
          else
            echo "::error title=Tag is not on main::The tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main (main is at $main_sha). Nothing was published. Merge the release's pull request first, then tag the merge commit."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
