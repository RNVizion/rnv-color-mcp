name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    # 3.13 is what the Space's Dockerfile runs; 3.12 was the only version ever
    # proven. Both are in the matrix rather than pinning the image down to the
    # tested one, because the suite and the engine were measured identical on
    # both (2026-09-12) -- so the fix is to widen the proof, not to downgrade
    # production to match it.
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  mirror-transcription:
    # THIS ONE GATES. A mirror that does not carry the commit it says it
    # carries is this repository being wrong, which is a defect and stops the
    # chain. Its sibling -- the same script in --mode currency, asking whether
    # upstream has moved PAST the pin -- is a queue and lives in a scheduled
    # workflow that gates nothing. See .github/workflows/brand-currency.yml.
    #
    # The job's name is a required status check in the ruleset on main.
    # Renaming it blocks every pull request until the ruleset is edited.
    #
    # Since Phase 8.12 (2026-11-01) it installs rnv-brand at the pin in
    # tests/requirements-dev.txt and compares the mirror with that, with no
    # fetch. The pytest jobs make the same comparison; this job keeps the
    # check's name and its plain-language verdict.
    name: mirror matches its pinned commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the register at the pin
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      # Any non-zero exit fails. Until 8.12 exit 2 meant upstream was
      # unreachable and warned instead. Nothing here reads upstream now, so a
      # 2 means the comparison could not be made in an environment this job
      # just built: no register where the install put it, or a mirror that
      # names no commit. The script prints which. A pin that cannot be
      # installed fails the step above.
      - name: Compare mirror against the register at SYNCED_SHA
        run: python scripts/check_brand_currency.py --mode transcription
