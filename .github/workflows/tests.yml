name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    # 3.13 is what the Space's Dockerfile runs; 3.12 was the only version ever
    # proven. Both are in the matrix rather than pinning the image down to the
    # tested one, because the suite and the engine were measured identical on
    # both (2026-09-12) -- so the fix is to widen the proof, not to downgrade
    # production to match it.
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  mirror-transcription:
    # THIS ONE GATES. A mirror that does not carry the commit it says it
    # carries is this repository being wrong, which is a defect and stops the
    # chain. Its sibling -- the same script in --mode currency, asking whether
    # upstream has moved PAST the pin -- is a queue and lives in a scheduled
    # workflow that gates nothing. See .github/workflows/brand-currency.yml.
    #
    # It is not in the pytest suite because the suite stays offline and
    # credential-free, and this reads the network.
    name: mirror matches its pinned commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Exit 2 means the comparison never ran: upstream was unreachable. That
      # is someone else's outage, not a mirror that lies about its pin, so it
      # warns and passes, exactly as the deploy gate in sync-hf.yml does. Until
      # 2026-09-29 this job failed on 2 as well, so an upstream incident turned
      # this status check red over a defect this repository did not have.
      - name: Compare mirror against upstream at SYNCED_SHA
        run: |
          set +e
          python scripts/check_brand_currency.py --mode transcription
          code=$?
          set -e
          case $code in
            0)
              echo "mirror verified against its pinned commit"
              ;;
            2)
              echo "::warning title=Mirror not verified::Upstream was unreachable, so the mirror could not be checked against its pin. This is an outage, not a mismatch."
              ;;
            *)
              echo "::error title=Mirror does not match its pin::engine/brand_vocab.py does not carry the commit its docstring claims. Fix the mirror or the pin."
              exit 1
              ;;
          esac
